[project]
name = "odds-monitor"
version = "0.1.0"
description = "Historical-replay odds monitor prototype (no real trading)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]  # literal CSV fixture rows are long
